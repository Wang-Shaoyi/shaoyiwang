<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Shaoyi Wang</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Gallery<span class="accent-mint"> ✦</span></h1>
        <p>Crochet, cooking, and things made with hands.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="filter-bar gallery-filter" id="gallery-filter">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Crochet">Crochet</button>
          <button class="filter-btn" data-filter="Cooking">Cooking</button>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 2026 Shaoyi Wang</p></footer>

  <script src="../scripts/components.js"></script>
  <script src="../scripts/data.js"></script>
  <script src="../scripts/main.js"></script>
</body>
</html>
