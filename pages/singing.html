<!DOCTYPE html>
<html lang="en">
<!--
  SINGING PAGE
  ─────────────────────────────────────────────
  To add a new song:
  1. Upload your audio file to  assets/audio/  (mp3 or m4a recommended)
  2. Copy one <div class="song-item"> block below and fill in:
       data-title   — song title
       data-artist  — original artist (optional)
       src          — path to your audio file, e.g.  ../assets/audio/my-song.mp3
  3. Save and push.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singing — Shaoyi Wang</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .song-list { display: flex; flex-direction: column; gap: 0; max-width: 680px; }

    .song-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .song-item:first-child { border-top: 1px solid var(--border); }

    .song-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .song-player {
      flex-shrink: 0;
      width: 260px;
    }
    .song-player audio {
      width: 100%;
      height: 32px;
    }

    @media (max-width: 600px) {
      .song-item { flex-wrap: wrap; }
      .song-player { width: 100%; }
    }
  </style>
</head>
<body data-root="../">
  <header class="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Singing</h1>
        <p>some recordings, just for fun :)</p>
      </div>
    </section>
    <section class="section-tight">
      <div class="container">
        <div class="song-list" id="song-list">

          <!-- ✏️ EXAMPLE — replace src with your real audio file path -->

            <div class="song-num">1</div>

            </div>
            <div class="song-player">
              <audio controls preload="none" src="../assets/audio/my-song.mp3"></audio>
            </div>
          </div> -->

          <p style="color:var(--text-muted);padding:8px 0">
            Nothing here yet — check back soon.
          </p>

        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 2026 Shaoyi Wang</p></footer>

  <script src="../scripts/components.js"></script>
  <script src="../scripts/main.js"></script>
</body>
</html>
